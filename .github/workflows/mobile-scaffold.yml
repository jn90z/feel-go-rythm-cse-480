name: Mobile - Build Debug Artifacts

on:
  push:
    branches:
      - app-packaging
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Generate platform icons
        run: npm run icons:generate

      - name: Initialize Android project
        run: npm run android:init

      - name: Build debug APK
        run: npm run android:build:debug-apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-android-debug
          path: |
            modern/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-android-project
          path: modern/src-tauri/gen/android
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Generate platform icons
        run: npm run icons:generate

      - name: Initialize iOS project
        run: npm run ios:init

      - name: Build iOS simulator app
        run: npm run ios:build:sim

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-ios-simulator
          path: |
            modern/src-tauri/gen/apple/build/**/*.app
            modern/src-tauri/target/aarch64-apple-ios-sim/debug/**/*.app
          if-no-files-found: warn

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-ios-project
          path: modern/src-tauri/gen/apple
          if-no-files-found: error

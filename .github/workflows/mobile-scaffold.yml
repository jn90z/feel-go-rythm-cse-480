name: Mobile - Build Debug Artifacts

on:
  push:
    branches:
      - app-packaging
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.12433566"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Initialize Android project
        run: npm run android:init

      - name: Build debug APK
        run: npm run android:build:debug-apk

      - name: Verify ARM64 16KB ELF alignment
        shell: bash
        run: |
          SO="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libfeel_go_rythm_lib.so"
          OBJDUMP="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump"
          "$OBJDUMP" -p "$SO" | grep LOAD
          if "$OBJDUMP" -p "$SO" | grep LOAD | grep -q "align 2\*\*12"; then
            echo "ERROR: ARM64 native library still contains 4KB-aligned LOAD segments"
            exit 1
          fi
          echo "ARM64 native library is compatible with 16KB page-size devices."

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: modern
          script: |
            set -eu
            trap 'adb logcat -d -t 1000 > android-smoke-logcat.txt 2>/dev/null || true' EXIT
            APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f \( -name '*universal*debug*.apk' -o -name '*debug*.apk' \) | head -n 1)
            if [ -z "$APK" ]; then
              echo "ERROR: No debug APK found."
              exit 1
            fi
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.jn90z.feelgorythm || true
            adb shell monkey -p com.jn90z.feelgorythm -c android.intent.category.LAUNCHER 1
            sleep 12
            PID=$(adb shell pidof com.jn90z.feelgorythm | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "ERROR: Feel-go-Rythm did not remain running after launch."
              adb logcat -d -t 500
              exit 1
            fi
            echo "Feel-go-Rythm is alive after launch (PID $PID)."
            if adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|Fatal signal|Process: com\.jn90z\.feelgorythm.*has died'; then
              echo "ERROR: Fatal Android crash detected in logcat."
              adb logcat -d -t 500
              exit 1
            fi
            adb shell dumpsys activity activities | grep -m 1 com.jn90z.feelgorythm || true

      - name: Upload Android smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-android-smoke-logcat
          path: modern/android-smoke-logcat.txt
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-android-debug
          path: |
            modern/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-android-project
          path: modern/src-tauri/gen/android
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: modern

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install CocoaPods
        run: brew install cocoapods

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Initialize iOS project
        run: npm run ios:init

      - name: Build iOS simulator app
        run: npm run ios:build:sim

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-ios-simulator
          path: |
            modern/src-tauri/gen/apple/build/**/*.app
            modern/src-tauri/target/aarch64-apple-ios-sim/debug/**/*.app
          if-no-files-found: warn

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: feel-go-rythm-ios-project
          path: modern/src-tauri/gen/apple
          if-no-files-found: error
